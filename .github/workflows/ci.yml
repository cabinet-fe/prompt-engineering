name: CI

# 只测 docs-server 子项目：技能/门户类提交不触发 Go 测试
on:
  push:
    branches: [main]
    paths:
      - "docs-server/**"
      - "scripts/push-docs.mjs"
      - "skills/tools/docs-gen/scripts/push-docs.mjs"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "docs-server/**"
      - "scripts/push-docs.mjs"
      - "skills/tools/docs-gen/scripts/push-docs.mjs"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: docs-server/go.mod
          cache-dependency-path: docs-server/go.sum
      - name: go vet
        working-directory: docs-server
        run: go vet ./...
      - name: go test
        working-directory: docs-server
        run: go test ./...
      # 推送脚本随 docs-gen 技能分发副本，两份必须逐字一致
      - name: push-docs 副本一致性
        run: diff scripts/push-docs.mjs skills/tools/docs-gen/scripts/push-docs.mjs

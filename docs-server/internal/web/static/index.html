<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs-server 文档</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar-title">docs-server 文档</span>
  </header>
  <main class="layout">
    <nav class="sidebar" aria-label="文档导航">
      <section class="pane">
        <h2>库</h2>
        <ul id="library-list" class="library-list"></ul>
      </section>
      <section class="pane">
        <h2>目录</h2>
        <div id="doc-tree" class="doc-tree"></div>
      </section>
    </nav>
    <article id="viewer" class="viewer">
      <p class="placeholder">从左侧选择一个库，然后点击目录树中的文档。</p>
    </article>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
